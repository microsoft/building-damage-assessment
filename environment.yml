name: bda
channels:
  - conda-forge
dependencies:
  - gdal
  - python<3.14
  - pip
  - pip:
    - adlfs
    - azure-storage-blob
    - dask_geopandas
    - deltalake
    - fiona
    - fsspec
    - geopandas
    - jupyter
    - mercantile
    - opencv-python
    - osmnx
    - pigeon-jupyter
    - planetary_computer
    - pyarrow
    - torch<2.11
    - rasterio
    - rtree
    - scikit-learn
    - setuptools<81
    - tensorboard
    # Optional: only needed for the DINOv3 + UPerNet ('upernet') segmentation
    # model (bda/dinov3_upernet.py). The DINOv3 backbones are gated on the HF
    # hub -- request access and run `huggingface-cli login` once.
    - transformers>=4.56
    - torchgeo[all]
    - torch<2.11
